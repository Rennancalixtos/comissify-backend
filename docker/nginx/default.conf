server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 100M;

    # IP real do usuário via proxy reverso / túnel FRP
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache assets Vite com hash no nome (imutáveis por 1 ano)
    location ~* /build/.*\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Cache imagens do storage (podem mudar, 30 dias)
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Cache outros assets estáticos
    location ~* \.(ico|svg|woff|woff2|ttf|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass         127.0.0.1:9000;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include              fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size  16k;
        fastcgi_buffers      8 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
