server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Limite conservador por padrão — rotas de upload têm limite próprio abaixo
    client_max_body_size 2M;

    # IP real do usuário via proxy reverso / túnel FRP
    # VPS IONOS (edge proxy) + redes internas Docker/Traefik
    set_real_ip_from 74.208.125.134;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # CSP: permite scripts/estilos do próprio domínio + MercadoPago SDK + Alpine inline.
    # 'unsafe-inline' em style-src é necessário para Tailwind/Alpine.
    # CSP: permite scripts/estilos do próprio domínio + MercadoPago SDK + Alpine inline.
    # 'unsafe-inline' em style-src é necessário para Tailwind/Alpine.
    # connect-src inclui api.mercadopago.com pois o SDK faz XHR direto do browser.
    # 'unsafe-eval' é necessário para Alpine.js (avalia expressões com new Function()).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com; frame-src https://www.mercadopago.com.br https://www.mercadopago.com; object-src 'none'; base-uri 'self';" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ferramentas admin (Horizon, Log Viewer): SPAs Vue que injetam inline scripts de
    # inicialização — precisam de unsafe-inline + unsafe-eval. Rotas protegidas por auth.
    location ~* ^/(horizon|log-viewer) {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src * data:; connect-src 'self' wss: ws:; font-src 'self' data:;" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Upload de screenshots (admin) e proxy de download de mídia
    location ~* ^/(admin/screenshots|download-proxy) {
        client_max_body_size 20M;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache assets Vite com hash no nome (imutáveis por 1 ano)
    location ~* /build/.*\.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # Cache imagens do storage (podem mudar, 30 dias)
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Cache outros assets estáticos
    location ~* \.(ico|svg|woff|woff2|ttf|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass         127.0.0.1:9000;
        fastcgi_param        SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include              fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size  16k;
        fastcgi_buffers      8 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
