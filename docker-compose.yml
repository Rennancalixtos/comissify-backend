version: '3.9'

networks:
  shopee-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  videos-storage:

services:

  # ─── PHP-FPM Application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopee_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - videos-storage:/var/www/storage/app/videos
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1   # disable in prod
    networks:
      - shopee-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Nginx ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: shopee_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shopee-net
    depends_on:
      - app

  # ─── MySQL 8 ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: shopee_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-shopee_automation}
      MYSQL_USER:          ${DB_USERNAME:-shopee}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-33060}:3306"
    networks:
      - shopee-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: shopee_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXTERNAL_PORT:-63790}:6379"
    networks:
      - shopee-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel Horizon ────────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopee_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www
      - videos-storage:/var/www/storage/app/videos
    networks:
      - shopee-net
    depends_on:
      - mysql
      - redis
